name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # mise.toml の dotnet-core と揃える（Renovate が同じ PR で上げる）
          dotnet-version: '10.0.403'

      - name: Test
        run: dotnet test

  # Cloudflare Workers 版はビルドと wrangler dev での確認まで（デプロイはしない）
  workers:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      # mise.toml の node と wrangler だけを入れる（.NET SDK は setup-dotnet のものを使う）
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node npm:wrangler

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/wasi-sdk
          key: wasi-sdk-29.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build
        run: scripts/workers.sh build

      - name: Smoke test
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          (cd src/CycleSharingMcp.Workers && wrangler dev --port 8787 --ip 127.0.0.1 --var SELFTEST:1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &)
          if ! python .github/scripts/workers_smoke_test.py http://127.0.0.1:8787; then
            cat "$RUNNER_TEMP/wrangler.log"
            exit 1
          fi

  build:
    name: build (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon の Mac は署名のないバイナリを起動しない。macOS 上で publish すると ad-hoc 署名が付くので macOS ランナーでビルドする
          - { os: macos-latest, rid: osx-arm64, exe: cycle-sharing-mcp }
          - { os: ubuntu-latest, rid: linux-x64, exe: cycle-sharing-mcp }
          - { os: windows-latest, rid: win-x64, exe: cycle-sharing-mcp.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'

      - name: Publish
        shell: bash
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_args=(-p:Version="${GITHUB_REF_NAME#v}")
          fi
          dotnet publish src/CycleSharingMcp -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:DebugType=none "${version_args[@]}" -o dist

      - name: Smoke test
        run: python .github/scripts/smoke_test.py dist/${{ matrix.exe }}

      # upload-artifact の zip では実行権限が落ちるので、tar.gz（Windows は zip）に固めてから上げる
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE README.md dist/
          tar -czf cycle-sharing-mcp-${{ matrix.rid }}.tar.gz -C dist .
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath cycle-sharing-mcp-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cycle-sharing-mcp-${{ matrix.rid }}
          path: cycle-sharing-mcp-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
